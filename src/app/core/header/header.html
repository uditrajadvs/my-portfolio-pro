<header class="site-header">
  <div class="header-inner">
    <a class="brand" routerLink="/overview" aria-label="Udit — overview" (click)="closeMenu()">
      <img class="brand-mark" src="/icons/ur-monogram.svg" alt="" aria-hidden="true" />
      <span class="brand-identity"><strong>{{ profile.name }}</strong><small>{{ profile.role }}</small></span>
    </a>

    <button
      class="menu-toggle"
      type="button"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="primary-navigation"
      [attr.aria-label]="menuOpen() ? 'Close navigation menu' : 'Open navigation menu'"
      (click)="toggleMenu()"
    >
      <span class="menu-label">{{ menuOpen() ? 'Close' : 'Menu' }}</span><span class="menu-lines" aria-hidden="true"><i></i><i></i></span>
    </button>

    <nav id="primary-navigation" class="navigation" [class.is-open]="menuOpen()" aria-label="Main navigation">
      @for (item of navigation; track item.href) {
        <a [routerLink]="item.href" routerLinkActive="current" [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page" (click)="closeMenu()">{{ item.label }}</a>
      }
      <div class="header-actions">
      <div class="theme-switcher" role="group" aria-label="Color theme">
        <button
          class="theme-option"
          type="button"
          aria-label="Light mode"
          title="Light mode"
          [attr.aria-pressed]="!darkMode()"
          (click)="themeToggle.emit(false)"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>
        </button>
        <button
          class="theme-option"
          type="button"
          aria-label="Dark mode"
          title="Dark mode"
          [attr.aria-pressed]="darkMode()"
          (click)="themeToggle.emit(true)"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.9 13A8.5 8.5 0 0 1 11 3.1 8.5 8.5 0 1 0 20.9 13Z"/></svg>
        </button>
      </div>
      <a class="resume-action" [href]="profile.resumeHref" target="_blank" rel="noopener noreferrer" (click)="closeMenu()">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M5 16v5h14v-5"/></svg>
        Download Resume
      </a>
      </div>
    </nav>
  </div>
</header>
