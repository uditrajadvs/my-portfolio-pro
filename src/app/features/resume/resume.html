<section class="resume-page" aria-labelledby="resume-title">
  <div class="resume-card">
    <header class="resume-toolbar">
      <h1 id="resume-title">My Resume</h1>
      <div class="resume-actions">
        <a class="resume-open" [href]="document.viewHref"
          target="_blank" rel="noopener noreferrer" title="Open in new tab" aria-label="Open resume in new tab">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3h7v7M21 3l-9 9M10 3H3v18h18v-7"/></svg>
        </a>
        <a class="resume-download" [href]="document.downloadHref" target="_blank" rel="noopener noreferrer" title="Download Resume" aria-label="Download resume">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M5 16v5h14v-5"/></svg>
        </a>
      </div>
    </header>
    <iframe class="resume-preview"
      [src]="previewUrl"
      title="Udit Raj original resume preview" allow="fullscreen"></iframe>
  </div>
</section>
