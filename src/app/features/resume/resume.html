<section class="resume-page" aria-labelledby="resume-title">
  <div class="resume-card">
    <header class="resume-toolbar">
      <h1 id="resume-title">My Resume</h1>
      <div class="resume-actions">
        <a class="resume-open" href="https://drive.google.com/file/d/1mDMbSgoB4wwszeKrgRfO75nsk08fl-8g/view"
          target="_blank" rel="noopener noreferrer">Open in new tab</a>
        <a class="resume-download" [href]="downloadHref" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M5 16v5h14v-5"/></svg>
          Download Resume
        </a>
      </div>
    </header>
    <iframe class="resume-preview"
      src="https://drive.google.com/file/d/1mDMbSgoB4wwszeKrgRfO75nsk08fl-8g/preview"
      title="Udit Raj original resume preview" allow="fullscreen"></iframe>
  </div>
</section>
